<style>
/* ===== الهوية والألوان ===== */
:root {
  /* ألوان الهوية الأساسية */
  --brand-teal: #019F9B;
  --brand-teal-bright: #03BAB5;
  --brand-deep: #1A2C2C;
  --brand-gold: #BC945B;
  --brand-cream: #F6F0E8;
  --brand-mint: #E5F4F4;
  --brand-green: #0DA269;

  /* أدوار مشتقة (الوضع الفاتح) */
  --primary: #017370;
  --primary-hover: #01615F;
  --on-primary: #FFFFFF;
  --primary-tint: #E5F4F4;
  --primary-border: #A6D9D7;
  --accent: var(--brand-gold);
  --accent-text: #8A6532;
  --accent-tint: #F7EFE2;
  --accent-border: #E0C9A2;
  --on-accent: #1A2C2C;

  --bg: #FBF8F3;
  --surface: #FFFFFF;
  --surface-2: #F6F0E8;
  --text: #1A2C2C;
  --heading: #1A2C2C;
  --muted: #4B5D5C;
  --border: #DCE5E3;
  --border-strong: #8FA5A3;
  --link: #017370;
  --focus: #017370;

  --success: #0A6B47;
  --success-bg: #E4F5EC;
  --success-border: #7CC9A3;
  --error: #B42318;
  --error-bg: #FDEDEB;
  --error-border: #EFA59C;
  --locked: #5A6969;
  --locked-bg: #EEF2F1;
  --locked-border: #B9C7C5;

  --header-bg: #1A2C2C;
  --header-text: #FFFFFF;
  --header-muted: #B8CACA;
  --header-line: rgba(255, 255, 255, .14);

  --shadow: 0 1px 2px rgba(26, 44, 44, .06), 0 6px 18px rgba(26, 44, 44, .07);
  --radius: 14px;
  --font: 'IBM Plex Sans Arabic', Tahoma, "Segoe UI", sans-serif;
}

/* الوضع الداكن حسب تفضيل النظام */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #03BAB5;
    --primary-hover: #3CD3CE;
    --on-primary: #0D1A1A;
    --primary-tint: #12302F;
    --primary-border: #22605D;
    --accent-text: #DDBF91;
    --accent-tint: #2A2419;
    --accent-border: #5E4B2D;
    --bg: #0E1919;
    --surface: #152525;
    --surface-2: #1A2C2C;
    --text: #E8F1F0;
    --heading: #F3F8F7;
    --muted: #A9BDBB;
    --border: #2A4241;
    --border-strong: #5F7E7C;
    --link: #4FD0CB;
    --focus: #EBCB95;
    --success: #6BD9A8;
    --success-bg: #0F3326;
    --success-border: #2A7356;
    --error: #FF9F94;
    --error-bg: #3A1714;
    --error-border: #84362E;
    --locked: #98AAA9;
    --locked-bg: #1A2828;
    --locked-border: #34504E;
    --header-bg: #0A1414;
    --header-muted: #A9BDBB;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  }
}
/* الوضع الداكن المختار يدويًا */
:root[data-theme="dark"] {
  --primary: #03BAB5;
  --primary-hover: #3CD3CE;
  --on-primary: #0D1A1A;
  --primary-tint: #12302F;
  --primary-border: #22605D;
  --accent-text: #DDBF91;
  --accent-tint: #2A2419;
  --accent-border: #5E4B2D;
  --bg: #0E1919;
  --surface: #152525;
  --surface-2: #1A2C2C;
  --text: #E8F1F0;
  --heading: #F3F8F7;
  --muted: #A9BDBB;
  --border: #2A4241;
  --border-strong: #5F7E7C;
  --link: #4FD0CB;
  --focus: #EBCB95;
  --success: #6BD9A8;
  --success-bg: #0F3326;
  --success-border: #2A7356;
  --error: #FF9F94;
  --error-bg: #3A1714;
  --error-border: #84362E;
  --locked: #98AAA9;
  --locked-bg: #1A2828;
  --locked-border: #34504E;
  --header-bg: #0A1414;
  --header-muted: #A9BDBB;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
}

/* ===== الأساسيات ===== */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 17px; -webkit-text-size-adjust: 100%; scroll-padding-top: 110px; }
html[data-big="1"] { font-size: 21px; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.85;
  overflow-x: hidden;
}
h1, h2, h3, h4 { line-height: 1.45; margin: 0 0 .5em; color: var(--heading); font-weight: 700; }
h1 { font-size: clamp(1.55rem, 1.1rem + 2vw, 2.35rem); }
h2 { font-size: 1.32rem; }
h3 { font-size: 1.1rem; }
h4 { font-size: 1rem; font-weight: 600; }
p { margin: 0 0 .9em; }
a { color: var(--link); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
ul, ol { padding-inline-start: 1.3em; margin: 0 0 1em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.icon { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.2em; }
.container { max-width: 1120px; margin-inline: auto; padding-inline: 16px; }
.skip { position: absolute; inset-inline-start: 12px; top: -80px; z-index: 400; background: var(--brand-gold); color: #1A2C2C; padding: 8px 14px; border-radius: 10px; font-weight: 700; }
.skip:focus { top: 12px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ===== الشريط العلوي ===== */
.topbar { position: sticky; top: 0; z-index: 50; background: var(--header-bg); color: var(--header-text); box-shadow: 0 2px 12px rgba(0, 0, 0, .18); }
.topbar-inner { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 700; flex: 1 1 auto; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 1rem; }
.stats { display: flex; gap: 6px; align-items: center; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: 999px; background: rgba(255, 255, 255, .1); font-weight: 600; font-size: .86rem; white-space: nowrap; }
.chip.level { background: var(--brand-gold); color: #1A2C2C; }
.tools { display: flex; gap: 6px; flex: none; }
.hbtn { background: transparent; border: 1px solid rgba(255, 255, 255, .4); color: inherit; border-radius: 10px; min-height: 40px; min-width: 40px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: .86rem; cursor: pointer; }
.hbtn:hover { background: rgba(255, 255, 255, .1); }
.hbtn:focus-visible, .stage-nav a:focus-visible { outline-color: var(--brand-gold); }
.progress-row { display: flex; align-items: center; gap: 10px; padding-bottom: 9px; font-size: .82rem; color: var(--header-muted); }
.progress { flex: 1; height: 10px; background: rgba(255, 255, 255, .16); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: linear-gradient(270deg, var(--brand-teal-bright), var(--brand-gold)); border-radius: 999px; transition: width .6s ease; }
.progress-text { white-space: nowrap; color: var(--header-text); font-weight: 600; }
.next-level { white-space: nowrap; }
@media (max-width: 640px) {
  .brand-text, .hbtn .lbl, .next-level { display: none; }
}

/* ===== شريط المراحل ===== */
.stage-nav { background: var(--header-bg); border-top: 1px solid var(--header-line); }
.stage-nav ul { position: relative; list-style: none; margin: 0; padding: 7px 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; }
.stage-nav a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; min-height: 38px; border-radius: 999px; color: var(--header-text); text-decoration: none; font-size: .87rem; white-space: nowrap; border: 1px solid var(--header-line); }
.stage-nav a:hover { background: rgba(255, 255, 255, .08); }
.stage-nav a[aria-current="page"] { background: var(--brand-gold); border-color: var(--brand-gold); color: #1A2C2C; font-weight: 600; }
.stage-nav a.locked { color: var(--header-muted); }
.stage-nav a.done .icon { color: #7FE0B4; }
.stage-nav a[aria-current="page"].done .icon { color: #0A5C3D; }

/* ===== الهيكل العام ===== */
main { display: block; padding-block: 24px 56px; }
main:focus { outline: none; }
.section { margin-block: 30px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.eyebrow { display: inline-block; font-size: .85rem; font-weight: 600; letter-spacing: 0; color: var(--accent-text); margin-bottom: .4em; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: .92rem; }
.note p:last-child { margin-bottom: 0; }

/* ===== الأزرار ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 2px solid var(--primary); background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; line-height: 1.4; }
.btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); text-decoration: none; }
.btn-ghost { background: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--primary-tint); color: var(--primary); }
.btn-gold { background: var(--brand-gold); border-color: var(--brand-gold); color: #1A2C2C; }
.btn-gold:hover { background: #CDA977; border-color: #CDA977; color: #1A2C2C; }
.btn-sm { min-height: 38px; padding: 4px 12px; font-size: .9rem; }
.btn-lg { min-height: 52px; padding: 10px 26px; font-size: 1.05rem; }
.btn[aria-disabled="true"] { opacity: .6; cursor: not-allowed; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; min-height: 40px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); cursor: pointer; font: inherit; }
.icon-btn:hover { background: var(--primary-tint); }
.icon-btn[aria-disabled="true"] { opacity: .35; cursor: not-allowed; }

/* ===== الصفحة الرئيسية ===== */
.hero { background: radial-gradient(120% 140% at 0% 0%, rgba(3, 186, 181, .35), transparent 55%), var(--brand-deep); color: #FFFFFF; border-radius: 20px; padding: clamp(22px, 4vw, 44px); position: relative; overflow: hidden; }
.hero h1 { color: #FFFFFF; }
.hero .eyebrow { color: #EBCB95; }
.hero .lead { font-size: 1.06rem; max-width: 760px; color: #E5EFEE; }
.hero .btn-ghost { color: #FFFFFF; border-color: rgba(255, 255, 255, .6); }
.hero .btn-ghost:hover { background: rgba(255, 255, 255, .1); color: #FFFFFF; }
.hero-art { position: absolute; inset-inline-start: -30px; bottom: -40px; width: 220px; height: 220px; opacity: .14; pointer-events: none; }
.hero > *:not(.hero-art) { position: relative; }
@media (max-width: 640px) { .hero-art { display: none; } }
.steps-how { counter-reset: how; }
.how { position: relative; padding-top: 26px; }
.how::before { counter-increment: how; content: counter(how); position: absolute; top: -14px; inset-inline-start: 18px; width: 34px; height: 34px; border-radius: 50%; background: var(--brand-gold); color: #1A2C2C; font-weight: 700; display: grid; place-items: center; }
.how h3 { margin-bottom: .3em; }
.how p { margin: 0; font-size: .93rem; color: var(--muted); }
.stage-card { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
.stage-card:hover { transform: translateY(-2px); border-color: var(--primary); }
.stage-card .top { display: flex; align-items: center; gap: 10px; }
.stage-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-tint); color: var(--primary); flex: none; }
.stage-ic .icon { width: 26px; height: 26px; }
.stage-card h3 { margin: 0; font-size: 1.02rem; }
.stage-card .meta { font-size: .85rem; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; width: fit-content; }
.status.done { background: var(--success-bg); color: var(--success); }
.status.open { background: var(--primary-tint); color: var(--primary); }
.status.locked { background: var(--locked-bg); color: var(--locked); }
.stage-card.is-locked { background: var(--locked-bg); border-style: dashed; box-shadow: none; }
.stage-card.is-locked .stage-ic { background: var(--surface); color: var(--locked); }
.mini-bar { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; margin-top: 4px; }
.mini-bar span { display: block; height: 100%; background: var(--primary); }
.level-card { text-align: center; padding: 18px 14px; }
.level-card .lv-ic { width: 44px; height: 44px; margin: 0 auto 6px; color: var(--accent-text); }
.level-card h3 { margin-bottom: .2em; }
.level-card p { margin: 0; font-size: .88rem; color: var(--muted); }
.level-card.current { border: 2px solid var(--brand-gold); background: var(--accent-tint); }

/* ===== صفحة المرحلة ===== */
.mod-head { display: grid; gap: 6px; }
.mod-head .story { font-size: 1.04rem; color: var(--muted); max-width: 820px; }
.objective { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-tint); border: 1px solid var(--accent-border); border-radius: 12px; padding: 12px 16px; max-width: 900px; }
.objective .icon { color: var(--accent-text); margin-top: .3em; }
.objective p { margin: 0; }
.explain { font-size: 1.04rem; max-width: 860px; }
.concepts .card h3 { font-size: 1rem; margin-bottom: .3em; color: var(--primary); }
.concepts .card p { margin: 0; font-size: .93rem; }
.formula { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.formula span { background: var(--surface); border: 1px solid var(--primary-border); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: .9rem; font-weight: 600; }
.formula b { color: var(--accent-text); }
.tier { border-top: 5px solid var(--primary); }
.tier.t2 { border-top-color: var(--brand-gold); }
.tier.t3 { border-top-color: var(--brand-deep); }
:root[data-theme="dark"] .tier.t3 { border-top-color: #8FA5A3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tier.t3 { border-top-color: #8FA5A3; } }
.tier h3 { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tier .fam { font-size: .9rem; color: var(--muted); font-weight: 500; }
.tier ul { margin: .4em 0 0; font-size: .92rem; }

/* بطاقة الميزة */
.feature { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-block: 16px; }
.feature > header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 6px; }
.feature > header h3 { margin: 0; }
.en { font-size: .88rem; color: var(--muted); font-weight: 500; direction: ltr; unicode-bidi: isolate; }
.use { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: .95rem; }
.tag-aware { font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--locked-bg); color: var(--locked); border: 1px solid var(--locked-border); }
.compare { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .compare { grid-template-columns: 1fr 1fr; } }
.tool { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
.tool.claude { border-top: 4px solid var(--brand-teal); }
.tool.chatgpt { border-top: 4px solid var(--border-strong); }
.tool h4 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: .5em; }
.tool-tag { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; direction: ltr; }
.claude .tool-tag { background: var(--primary-tint); color: var(--primary); }
.chatgpt .tool-tag { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.tool p { font-size: .95rem; }
.label-badge { display: inline-block; background: var(--accent-tint); color: var(--accent-text); border: 1px solid var(--accent-border); border-radius: 8px; padding: 1px 9px; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
.lang-badge { display: inline-flex; gap: 4px; align-items: center; font-size: .82rem; font-weight: 600; padding: 1px 9px; border-radius: 8px; margin-bottom: 6px; }
.lang-badge.yes { background: var(--success-bg); color: var(--success); }
.lang-badge.no { background: var(--error-bg); color: var(--error); }
.avail { font-size: .87rem; color: var(--muted); margin-bottom: .4em; }
.src { font-size: .84rem; margin: 0; }
.src a { overflow-wrap: anywhere; }
.combo { border: 2px dashed var(--primary-border); background: var(--primary-tint); }
.gemini { display: flex; gap: 10px; align-items: flex-start; font-size: .93rem; border-inline-start: 4px solid var(--border-strong); background: var(--surface); border-radius: 10px; padding: 10px 14px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); border-inline-end: 1px solid var(--border); }
.gemini p { margin: 0; }

/* الخصوصية */
.privacy-note { display: flex; gap: 14px; align-items: flex-start; background: var(--error-bg); border: 1px solid var(--error-border); border-radius: var(--radius); padding: 16px 18px; }
.privacy-note > .icon { width: 30px; height: 30px; color: var(--error); margin-top: 2px; }
.privacy-note h3 { margin-bottom: .3em; }
.privacy-note p { margin-bottom: .4em; }

/* جرّبها الآن */
.tryit { background: var(--primary-tint); border: 1px solid var(--primary-border); border-radius: var(--radius); padding: 18px; }
.tryit h2 { display: flex; align-items: center; gap: 8px; }
.prompt { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font); font-size: .95rem; line-height: 1.95; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-inline-start: 4px solid var(--brand-gold); border-radius: 10px; padding: 14px 16px; margin: 0 0 10px; text-align: start; }
.prompt.small { font-size: .92rem; margin: 6px 0 12px; background: var(--surface-2); }
.case { border-inline-start: 5px solid var(--brand-gold); }
.case .row { justify-content: space-between; }

/* ===== التحديات ===== */
.challenge { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-block: 18px; box-shadow: var(--shadow); }
.challenge.is-solved { border-color: var(--success-border); }
.challenge.boss { border: 2px solid var(--brand-gold); background: linear-gradient(180deg, var(--accent-tint), var(--surface) 160px); }
.challenge.is-locked { background: var(--locked-bg); border: 2px dashed var(--locked-border); box-shadow: none; }
.ch-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.ch-head h3 { flex: 1 1 240px; margin: 0; }
.type-tag { font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--primary-tint); color: var(--primary); white-space: nowrap; }
.boss .type-tag { background: var(--brand-gold); color: #1A2C2C; }
.xp-tag { font-size: .86rem; font-weight: 600; color: var(--accent-text); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.is-solved .xp-tag { color: var(--success); }
.q { font-weight: 600; font-size: 1.02rem; }
.scenario { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; border-inline-start: 4px solid var(--border-strong); }
.weak-label { font-size: .88rem; font-weight: 600; color: var(--error); }
.options { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: start; padding: 11px 14px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; line-height: 1.75; }
.opt:hover { border-color: var(--primary); background: var(--primary-tint); }
.opt.right { border-color: var(--success); background: var(--success-bg); }
.opt.wrong { border-color: var(--error); background: var(--error-bg); }
.opt[aria-disabled="true"] { cursor: default; }
.opt[aria-disabled="true"]:hover:not(.right):not(.wrong) { border-color: var(--border); background: var(--surface); }
.opt .state-ic { margin-inline-start: auto; margin-top: .3em; }
.opt.right .state-ic { color: var(--success); }
.opt.wrong .state-ic { color: var(--error); }
.letter { flex: none; width: 28px; height: 28px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--border); font-weight: 700; font-size: .85rem; }
.why { margin: 6px 6px 0; padding: 8px 12px; border-radius: 8px; font-size: .92rem; }
.why.ok { background: var(--success-bg); border-inline-start: 3px solid var(--success); }
.why.no { background: var(--error-bg); border-inline-start: 3px solid var(--error); }
.why strong { color: inherit; }
.feedback { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
.feedback:empty { display: none; }
.feedback.ok { color: var(--success); background: var(--success-bg); }
.feedback.no { color: var(--error); background: var(--error-bg); }
.feedback.info { background: var(--surface-2); }
.order-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
.order-list li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); }
.order-list li.ok { border-color: var(--success); background: var(--success-bg); }
.order-list li.bad { border-color: var(--error); background: var(--error-bg); }
.order-list .num { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--brand-deep); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.order-list .txt { flex: 1; }
.order-list .ctrl { display: flex; gap: 4px; flex: none; }
.order-list li.ok > .icon { color: var(--success); }
.match { display: grid; gap: 10px; margin-bottom: 12px; }
.match-row { display: grid; grid-template-columns: 1fr; gap: 6px 12px; padding: 10px 12px; border: 2px solid var(--border); border-radius: 12px; align-items: center; }
@media (min-width: 760px) { .match-row { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 28px; } }
.match-row.ok { border-color: var(--success); background: var(--success-bg); }
.match-row.bad { border-color: var(--error); background: var(--error-bg); }
.match-row label { font-weight: 500; }
.match-row .icon { width: 24px; height: 24px; }
.match-row.ok .icon { color: var(--success); }
.match-row.bad .icon { color: var(--error); }
.match-answer { font-weight: 600; color: var(--success); }
select, textarea, input[type="text"] { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; }
select { min-height: 44px; padding: 6px 10px; width: 100%; }
textarea { width: 100%; line-height: 1.85; padding: 12px; resize: vertical; min-height: 180px; }
input[type="text"] { min-height: 42px; padding: 6px 10px; width: 100%; }
.lbl { display: block; font-weight: 600; margin-bottom: 6px; }
.hint { font-size: .93rem; color: var(--muted); }
.count { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
.checklist { border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px 12px; margin: 14px 0; }
.checklist legend { font-weight: 600; padding: 0 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 6px; accent-color: var(--primary); flex: none; }
details.sample { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; }
details.sample summary { cursor: pointer; font-weight: 600; color: var(--primary); }
.step-meta { font-weight: 600; color: var(--accent-text); margin-bottom: 6px; }
.step-dots { display: flex; gap: 6px; margin-bottom: 12px; }
.step-dots span { width: 28px; height: 8px; border-radius: 999px; background: var(--border); }
.step-dots span.on { background: var(--brand-gold); }
.step-dots span.done { background: var(--success); }
.step-current { border-top: 1px solid var(--border); padding-top: 12px; }
.step-current h4 { color: var(--primary); }
details.step-done { border: 1px solid var(--success-border); background: var(--success-bg); border-radius: 10px; padding: 8px 14px; margin-bottom: 10px; }
details.step-done summary { cursor: pointer; font-weight: 600; color: var(--success); }
details.step-done[open] { background: var(--surface); }
.case-facts { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); margin: 0 0 14px; }
.case-facts div { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
.case-facts dt { font-size: .82rem; color: var(--muted); }
.case-facts dd { margin: 0; font-weight: 600; }
.locked-msg { display: flex; gap: 12px; align-items: center; color: var(--locked); margin: 0; }
.locked-msg .icon { width: 28px; height: 28px; }

/* الشارة */
.badge-zone { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; padding: 20px; border-radius: var(--radius); border: 2px dashed var(--locked-border); background: var(--surface); }
.badge-zone.earned { border: 2px solid var(--brand-gold); background: var(--accent-tint); }
.badge-zone > div { flex: 1 1 260px; }
.badge-svg { width: 104px; height: 104px; flex: none; }
.badge-zone.earned .badge-svg { animation: pop .5s ease; }
.badges-row { display: flex; flex-wrap: wrap; gap: 14px; }
.badges-row figure { margin: 0; text-align: center; width: 104px; font-size: .8rem; }
.badges-row .badge-svg { width: 72px; height: 72px; }

/* صفحات المراجع */
.points { counter-reset: pt; list-style: none; padding: 0; display: grid; gap: 12px; }
.points li { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 14px 16px; position: relative; padding-inline-start: 58px; }
.points li::before { counter-increment: pt; content: counter(pt); position: absolute; inset-inline-start: 14px; top: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--brand-deep); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; }
.points h3 { font-size: 1rem; margin-bottom: .2em; }
.points p { margin-bottom: .3em; font-size: .95rem; }
.traffic .card { border-top: 6px solid; }
.traffic .green { border-top-color: #0DA269; }
.traffic .amber { border-top-color: #BC945B; }
.traffic .red { border-top-color: #B42318; }
.traffic ul { font-size: .93rem; margin: 0; }
.src-list { list-style: none; padding: 0; display: grid; gap: 8px; }
.src-list li { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; }
.src-list a { overflow-wrap: anywhere; font-size: .86rem; display: block; direction: ltr; text-align: right; }
.src-list .t { font-weight: 600; }

/* ===== التذييل ===== */
footer { border-top: 1px solid var(--border); padding-block: 22px 30px; font-size: .9rem; color: var(--muted); }
footer .row { justify-content: space-between; }

/* ===== الإشعارات ===== */
#toasts { position: fixed; inset-inline: 0; bottom: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 250; pointer-events: none; padding-inline: 16px; }
.toast { background: #10201F; color: #FFFFFF; padding: 10px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); border-inline-start: 5px solid var(--brand-gold); font-weight: 600; max-width: 520px; animation: toastIn .25s ease; }
.toast.ok { border-inline-start-color: #3CCB8D; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.7); } 70% { transform: scale(1.06); } 100% { transform: scale(1); } }

/* ===== أدوات الميسّر ===== */
dialog { border: none; border-radius: 16px; padding: 0; width: min(780px, calc(100vw - 24px)); max-height: calc(100vh - 24px); background: var(--surface); color: var(--text); box-shadow: 0 24px 70px rgba(0, 0, 0, .4); }
dialog::backdrop { background: rgba(8, 18, 18, .6); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px; background: var(--header-bg); color: #FFFFFF; position: sticky; top: 0; z-index: 2; }
.dlg-head h2 { color: #FFFFFF; margin: 0; font-size: 1.15rem; }
.dlg-body { padding: 18px; }
.dlg-body section { margin-bottom: 22px; }
.dlg-body h3 { display: flex; gap: 8px; align-items: center; }
.team-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.team-row .score { font-size: 1.4rem; font-weight: 700; min-width: 3ch; text-align: center; }
.team-ctrl { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.timer-box { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.timer-display { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 5ch; text-align: center; direction: ltr; }
.timer-display.done { color: var(--error); }
.agenda { width: 100%; border-collapse: collapse; font-size: .92rem; }
.agenda th, .agenda td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: start; vertical-align: top; }
.agenda th { color: var(--muted); font-weight: 600; }
.switch { display: flex; gap: 10px; align-items: center; cursor: pointer; padding: 4px 0; }
.switch input { width: 22px; height: 22px; accent-color: var(--primary); }
#projector { position: fixed; inset: 0; z-index: 300; background: radial-gradient(120% 120% at 100% 0%, rgba(3, 186, 181, .22), transparent 60%), #0F1E1E; color: #FFFFFF; display: flex; flex-direction: column; gap: 18px; padding: clamp(16px, 3vw, 36px); overflow: auto; }
#projector[hidden] { display: none; }
.proj-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.proj-head h2 { color: #FFFFFF; margin: 0; font-size: clamp(1.2rem, 2.4vw, 2rem); }
.proj-timer { text-align: center; }
.proj-timer .row { justify-content: center; }
.proj-timer .timer-display { font-size: clamp(3.2rem, 11vw, 9rem); line-height: 1.1; color: #F2DCB5; }
.proj-timer .timer-display.done { color: #FF9F94; }
.proj-teams { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.team-card { background: rgba(255, 255, 255, .06); border: 2px solid rgba(255, 255, 255, .16); border-radius: 20px; padding: 18px; text-align: center; }
.team-card.lead { border-color: var(--brand-gold); }
.team-card .name { font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight: 700; }
.team-card .big { font-size: clamp(3rem, 7vw, 6.5rem); font-weight: 700; line-height: 1.1; color: #F2DCB5; font-variant-numeric: tabular-nums; }
.proj-btn { background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .35); color: #FFFFFF; border-radius: 10px; min-height: 44px; min-width: 44px; padding: 4px 12px; font: inherit; font-weight: 600; cursor: pointer; }
.proj-btn:hover { background: rgba(255, 255, 255, .16); }
.proj-btn:focus-visible { outline-color: var(--brand-gold); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  .topbar, .stage-nav, footer, #toasts, .btn, .icon-btn { display: none !important; }
  body { background: #FFFFFF; }
}
</style>
</head>

  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = seed; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function shuffledIdx(n, seedStr) {
    const r = rng(hash(seedStr)); const a = [];
    for (let i = 0; i < n; i++) a.push(i);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }

  }
  function srcLinks(keys) {
    if (!keys || !keys.length) return '';

  }

  /* ---------- الحسابات ---------- */
  const isSolved = id => !!state.solved[id];
  function keySolved(key) { const r = REG[key]; if (!r) return false; if (r.step === null) return isSolved(r.chId); return isSolved(r.chId) || (state.steps[r.chId] || 0) > r.step; }
  const totalXP = () => Object.keys(state.solved).reduce((a, id) => a + ((state.solved[id] && state.solved[id].xp) || 0), 0);
  function levelIndex(xp) { let i = 0; LEVELS.forEach((L, k) => { if (xp >= L.min) i = k; }); return i; }
  const modDone = m => isSolved(m.boss.id);
  function modUnlocked(i) { return state.unlockAll || i === 0 || modDone(MODULES[i - 1]); }
  function bossOpen(m) { return state.unlockAll || m.challenges.every(c => isSolved(c.id)); }
  function finalUnlocked() { return state.unlockAll || MODULES.every(modDone); }
  function modSolvedCount(m) { return m.challenges.filter(c => isSolved(c.id)).length + (modDone(m) ? 1 : 0); }
  function progressPct() { return Math.round(ALL_IDS.filter(isSolved).length / ALL_IDS.length * 100); }

  /* ---------- الإشعارات ---------- */
  function toast(msg, kind) {

  }

  /* ---------- رسم الشارة ---------- */

    return '<svg class="badge-svg" viewBox="0 0 120 120" role="img" aria-label="' + esc(label) + (earned ? ' (حصلت عليها)' : ' (لم تُكتسب بعد)') + '">' +
      '<path d="M38 84l-10 30 18-8 10 14 6-30z" fill="' + ring + '" opacity=".85"/><path d="M82 84l10 30-18-8-10 14-6-30z" fill="' + ring + '" opacity=".85"/>' +
      '<circle cx="60" cy="56" r="44" fill="' + ring + '"/><circle cx="60" cy="56" r="36" fill="' + fill + '"/>' +
      '<g transform="translate(40 36) scale(1.67)" color="' + glyph + '" style="color:' + glyph + '"><use href="#i-' + (earned ? ic : 'lock') + '" width="24" height="24"/></g></svg>';
  }

  /* ---------- الشريط العلوي والتنقل ---------- */
  function renderHeader() {

    $('#xpVal').textContent = fmt(xp);

    $('#nextLevel').textContent = next ? 'تبقّى ' + fmt(next.min - xp) + ' نقطة لمستوى «' + next.name + '»' : 'بلغت أعلى مستوى';
    const tb = $('#themeBtn');
    tb.innerHTML = icon(THEME_ICON[state.theme]);

    tb.setAttribute('title', 'المظهر: ' + THEME_LABEL[state.theme]);

  }
  function navItem(href, label, ic, cls, extra) {
    const cur = currentRoute() === href.slice(1);
    return '<li><a href="' + href + '" class="' + (cls || '') + '"' + (cur ? ' aria-current="page"' : '') + '>' + icon(ic) + '<span>' + esc(label) + '</span>' + (extra || '') + '</a></li>';
  }
  function renderNav() {
    let h = navItem('#home', 'الرئيسية', 'home');

      const un = modUnlocked(i), done = modDone(m);
      h += navItem('#' + m.id, 'المرحلة ' + m.n, done ? 'check' : (un ? m.icon : 'lock'), done ? 'done' : (un ? '' : 'locked'), un ? (done ? '<span class="sr-only">(مكتملة)</span>' : '') : '<span class="sr-only">(مقفلة)</span>');
    });
    const fu = finalUnlocked();
    h += navItem('#final', 'الحالة الختامية', isSolved('final') ? 'check' : (fu ? 'flag' : 'lock'), isSolved('final') ? 'done' : (fu ? '' : 'locked'), fu ? '' : '<span class="sr-only">(مقفلة)</span>');
    h += navItem('#privacy', 'دليل الخصوصية', 'shield');
    h += navItem('#sources', 'المصادر', 'book');
    $('#stageNav').innerHTML = h;
  }

  /* ---------- التوجيه ---------- */
  const ROUTES = ['home', 'm1', 'm2', 'm3', 'm4', 'm5', 'final', 'privacy', 'sources'];
  function currentRoute() { const h = (location.hash || '').replace('#', ''); return ROUTES.indexOf(h) >= 0 ? h : (lastRoute || 'home'); }

  function renderView(isNav) {
    const r = currentRoute(); lastRoute = r;

    else if (r === 'privacy') html = viewPrivacy();
    else if (r === 'sources') html = viewSources();
    else { const i = MODULES.findIndex(m => m.id === r); html = viewModule(MODULES[i], i); }
    main.innerHTML = html;
    const titles = { home: '', privacy: 'دليل الخصوصية', sources: 'المصادر', final: 'الحالة الختامية' };
    const mod = MODULES.find(m => m.id === r);
    document.title = (mod ? 'المرحلة ' + mod.n + ': ' + mod.title + ' | ' : (titles[r] ? titles[r] + ' | ' : '')) + 'تطبيقات الذكاء الاصطناعي لمديري المنح';
    if (isNav) {
      window.scrollTo(0, 0);

  }

  /* ---------- التحديات ---------- */
  const MARKS = {};   // نتيجة آخر تحقق (ترتيب/مطابقة)
  const FEED = {};    // رسائل التغذية الراجعة

  function challengeHTML(c, locked, m) {

    document.querySelectorAll('[data-act="t-toggle"]').forEach(b => { b.innerHTML = icon(timer.running ? 'pause' : 'play') + '<span>' + (timer.running ? 'إيقاف مؤقت' : 'ابدأ') + '</span>'; });
  }

      o.start(); o.stop(ctx.currentTime + 1);

  }

      '<label class="switch"><input type="checkbox" data-change="big"' + (state.big ? ' checked' : '') + '><span>تكبير الخط لشاشة العرض</span></label></section>' +
      '<section><h3>' + icon('users') + 'لوحة نتائج الفرق</h3>' +
      '<div class="row"><label for="teamCount">عدد الفرق:</label><select id="teamCount" data-change="teamcount" style="width:auto">' + [2, 3, 4].map(n => '<option value="' + n + '"' + (state.teams.length === n ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
      '<button type="button" class="btn btn-sm btn-ghost" data-act="scores-reset">تصفير النقاط</button></div>' +
      '<div id="teamsBox">' + teamsRows() + '</div></section>' +
      '<section><h3>' + icon('timer') + 'مؤقت التحدي</h3><div class="timer-box"><span class="timer-display" data-timer-display role="timer" aria-live="off"></span>' + timerControls() + '</div></section>' +
      '<section><button type="button" class="btn" data-act="open-proj">' + icon('screen') + 'اعرض النتائج والمؤقت على الشاشة</button></section>' +
      '<section><h3>' + icon('book') + 'جدول مقترح لورشة 3 ساعات (20 مشاركًا)</h3><table class="agenda"><thead><tr><th scope="col">المدة</th><th scope="col">الفقرة</th></tr></thead><tbody>' +
      [['15 د', 'افتتاح، وتقسيم المشاركين إلى فرق (2 إلى 4)، وجولة في الموقع ودليل الخصوصية'], ['30 د', 'المرحلة 1: المقدمة واختيار النموذج'], ['30 د', 'المرحلة 2: الوكلاء'], ['10 د', 'استراحة'], ['25 د', 'المرحلة 3: الأعمال اليومية'], ['25 د', 'المرحلة 4: الأتمتة'], ['30 د', 'المرحلة 5: الحالات العملية'], ['15 د', 'الحالة الختامية بين الفرق، وإعلان النتائج والختام']]
        .map(r => '<tr><td>' + r[0] + '</td><td>' + esc(r[1]) + '</td></tr>').join('') + '</tbody></table>' +
      '<p class="small muted">اقتراح: اعرض كل تحدٍّ على الشاشة، وامنح الفرق دقيقتين للنقاش، ثم أضف النقاط للفريق صاحب الإجابة الصحيحة والتبرير الأفضل.</p></section>';
    renderTimer();
  }
  function renderProjector() {
    const p = $('#projector'); if (p.hidden) return;
    const max = Math.max.apply(null, state.teams.map(t => t.score));
    p.innerHTML = '<div class="proj-head"><h2 id="projTitle">لوحة نتائج الفرق</h2><button type="button" class="proj-btn" data-act="close-proj">' + icon('x') + ' إغلاق</button></div>' +
      '<div class="proj-timer"><div class="timer-display" data-timer-display role="timer" aria-live="off"></div>' + timerControls('proj-btn') + '</div>' +
      '<div class="proj-teams">' + state.teams.map((t, i) => '<div class="team-card' + (t.score === max && max > 0 ? ' lead' : '') + '"><div class="name">' + esc(t.name) + '</div><div class="big" aria-live="polite">' + fmt(t.score) + '</div>' +
        '<div class="row" style="justify-content:center"><button type="button" class="proj-btn" dir="ltr" data-act="score" data-i="' + i + '" data-d="-5" aria-label="اطرح 5 نقاط من ' + esc(t.name) + '">−5</button><button type="button" class="proj-btn" dir="ltr" data-act="score" data-i="' + i + '" data-d="5" aria-label="أضف 5 نقاط إلى ' + esc(t.name) + '">+5</button><button type="button" class="proj-btn" dir="ltr" data-act="score" data-i="' + i + '" data-d="10" aria-label="أضف 10 نقاط إلى ' + esc(t.name) + '">+10</button></div></div>').join('') + '</div>';
    renderTimer();
  }
  let projReturn = null;
  function openProjector() {
    const d = $('#facil'); if (d.open) d.close();
    const p = $('#projector'); p.hidden = false; renderProjector();
    const btn = p.querySelector('[data-act="close-proj"]'); if (btn) btn.focus();
  }
  function closeProjector() { const p = $('#projector'); p.hidden = true; p.innerHTML = ''; const b = projReturn || $('#facilBtn'); if (b) b.focus(); }
  function updateTeams() {
    const box = $('#teamsBox');
    if (box) {
      const ae = document.activeElement; const fk = ae && ae.closest('#teamsBox') ? (ae.id || (ae.dataset.act + ae.dataset.i + ae.dataset.d)) : null;
      box.innerHTML = teamsRows();
      if (fk) { const el = document.getElementById(fk) || box.querySelector('[data-act="' + ae.dataset.act + '"][data-i="' + ae.dataset.i + '"][data-d="' + ae.dataset.d + '"]'); if (el) el.focus(); }
    }
    if (!$('#projector').hidden) {
      const ae = document.activeElement; const sel = ae && ae.dataset && ae.dataset.act === 'score' ? '[data-act="score"][data-i="' + ae.dataset.i + '"][data-d="' + ae.dataset.d + '"]' : null;
      renderProjector();
      if (sel) { const el = $('#projector').querySelector(sel); if (el) el.focus(); }
    }
  }

  /* ---------- المراجع ---------- */
  function viewPrivacy() {
    let h = '<header class="mod-head"><span class="eyebrow">مرجع توعوي</span><h1 tabindex="-1">الخصوصية وحماية البيانات عند استخدام أدوات الذكاء الاصطناعي</h1>' +
      '<p class="story">تتعامل المؤسسات الأهلية يوميًا مع بيانات المستفيدين ووثائق الجمعيات ومواد مجلس الأمناء. وهذه النقاط مستخلصة من مصادر سعودية رسمية لتساعدك على الوعي بالمخاطر قبل استخدام أي أداة مستضافة خارج المملكة.</p>' +
      '<div class="objective">' + icon('shield') + '<p><strong>تنبيه:</strong> هذا القسم للتوعية العامة وليس استشارة قانونية. ارجع إلى النص الرسمي وإلى المختصين والسياسات المعتمدة في مؤسستك قبل أي قرار. ولا توجد أداة أو ربط آمن تمامًا؛ فالحماية تأتي من تقليل ما تشاركه وضبط الصلاحيات.</p></div></header>';
    h += '<section class="section"><h2>ماذا تقول المصادر الرسمية؟</h2><ol class="points">' +
      PRIVACY_POINTS.map(pt => '<li><h3>' + esc(pt.h) + '</h3><p>' + esc(pt.p) + '</p><p class="small muted">المرجع: ' + esc(pt.ref) + '</p>' + srcLinks(pt.src) + '</li>').join('') + '</ol></section>';
    h += '<section class="section traffic"><h2>تصنيف عملي مقترح قبل الرفع</h2><p class="muted">تصنيف إرشادي للمساعدة على التفكير، ولا يغني عن سياسة تصنيف البيانات في مؤسستك.</p><div class="grid g3">' +
      '<div class="card green"><h3>مناسب عادة</h3><ul><li>الأدلة والنماذج والسياسات المنشورة</li><li>نصوص افتراضية للتدريب والتجربة</li><li>أرقام مجمّعة لا تعرّف أحدًا</li><li>مسودات مراسلات عامة دون بيانات شخصية</li></ul></div>' +
      '<div class="card amber"><h3>بحذر ووفق سياسة المؤسسة</h3><ul><li>مقترحات الجمعيات بعد إزالة بيانات الأفراد</li><li>تقارير الإنجاز بعد حذف الأسماء والصور</li><li>المراسلات الرسمية عبر حساب مؤسسي معتمد</li></ul></div>' +
      '<div class="card red"><h3>لا تُرفع إلى أداة عامة</h3><ul><li>كشوف المستفيدين وأرقام هوياتهم وجوالاتهم</li><li>البيانات الصحية وبيانات الأيتام ومن لا يُعرف والداه</li><li>محاضر مجلس الأمناء ومداولات اللجان السرية</li><li>كلمات المرور وبيانات الحسابات البنكية</li></ul></div></div></section>';
    h += '<section class="section card"><h2>قبل أن ترفع أي ملف، اسأل نفسك</h2><ol>' +
      ['هل أحتاج فعلًا إلى هذا الملف كاملًا، أم يكفي جزء منه أو أرقام مجمّعة؟', 'هل فيه ما يعرّف شخصًا بشكل مباشر أو غير مباشر؟', 'هل فيه بيانات حساسة، كالصحة أو الوضع العائلي؟', 'هل الحساب الذي أستخدمه حساب مؤسسي معتمد ووفق سياسة المؤسسة؟', 'هل أعرف أين تُعالج البيانات، وما ضوابط نقلها إلى خارج المملكة؟', 'هل سأراجع المخرج بنفسي قبل أن يخرج باسم المؤسسة؟'].map(q => '<li>' + esc(q) + '</li>').join('') +
      '</ol></section>';
    return h;
  }
  function viewSources() {
    let h = '<header class="mod-head"><span class="eyebrow">المراجع</span><h1 tabindex="-1">المصادر</h1><p class="story">كل معلومة عن الميزات والإتاحة والخصوصية في هذا الموقع مأخوذة من المصادر الرسمية التالية. تاريخ التحقق: <span class="ltr">' + VERIFIED_ON + '</span>.</p></header>';
    SRC_GROUPS.forEach(g => {
      const keys = Object.keys(SRC).filter(k => k.indexOf(g.prefix) === 0);
      if (!keys.length) return;
      h += '<section class="section"><h2>' + esc(g.title) + '</h2><ul class="src-list">' + keys.map(k => '<li><span class="t">' + esc(SRC[k].t) + '</span><a href="' + esc(SRC[k].u) + '" target="_blank" rel="noopener">' + esc(SRC[k].u) + '</a></li>').join('') + '</ul></section>';
    });
    h += '<section class="section note"><h2>ملاحظات التحقق</h2><ul>' +
      '<li>الإتاحة في المملكة: Claude متاح في المملكة العربية السعودية وفق قائمة الدول المدعومة لدى Anthropic، وكذلك ChatGPT وفق قائمة OpenAI، وGemini وفق صفحة Google.</li>' +
      '<li>اللغة العربية: يتحاور Claude بلغة المستخدم ويدعم العربية في المحادثة النصية، لكن العربية ليست ضمن لغات واجهته ولا ضمن لغات وضع الصوت المعلنة. والعربية من لغات واجهة ChatGPT.</li>' +
      '<li>استُبعدت ميزتا Dispatch وChannels: الأولى في نسخة تجريبية محدودة وغير متاحة للمستخدمين الجدد، والثانية معاينة بحثية موجهة للمطورين.</li>' +
      '<li>لم نذكر خيارًا «تلقائيًا» لاختيار النموذج في Claude لعدم وجوده في المصادر الرسمية، ولم نذكر أرقام إصدارات النماذج لأنها تتغير باستمرار.</li>' +
      '<li>بعض صفحات مركز مساعدة OpenAI حجبت القراءة الآلية وقت التحقق، فاعتُمد فيها على ما تعرضه نتائج البحث من الصفحات الرسمية نفسها، وعلى توثيق OpenAI في learn.chatgpt.com.</li>' +
      '<li>لا يذكر الموقع أسعارًا أو حدودًا رقمية للاستخدام، ولا مسارات قوائم تفصيلية، لأنها تتغير باستمرار.</li></ul></section>';
    return h;
  }

  /* ---------- الحالة الختامية ---------- */
  function viewFinal() {
    if (!finalUnlocked()) {
      const left = MODULES.filter(m => !modDone(m)).map(m => m.n).join(' و');
      return '<section class="card" style="text-align:center;padding:40px 20px"><span class="stage-ic" style="margin:0 auto 12px;width:64px;height:64px">' + icon('lock') + '</span><h1 tabindex="-1">الحالة الختامية</h1><p>تُفتح الحالة الختامية بعد إكمال المراحل الخمس. المراحل المتبقية: ' + esc(left) + '.</p><a class="btn" href="' + resumeTarget() + '">تابع التعلم</a></section>';
    }
    const done = isSolved('final'); const xp = totalXP(); const li = levelIndex(xp);
    let h = '<header class="mod-head"><span class="eyebrow">ختام الموسم · نحو 15 دقيقة</span><h1 tabindex="-1">من استلام الطلب إلى توصية مجلس الأمناء</h1>' +
      '<p class="story">وصل طلب جديد إلى «' + esc(STORY.foundation) + '». طبّق عليه ما تعلمته في المراحل الخمس: الفرز، والتلخيص، والعناية الواجبة، والتقييم، والخصوصية، والتوصية.</p></header>';
    h += '<section class="section" aria-labelledby="finSteps"><h2 id="finSteps" class="sr-only">خطوات الحالة الختامية</h2>' + challengeHTML(FINAL, false) + '</section>';
    h += '<section class="section badge-zone' + (done ? ' earned' : '') + '">' + badgeSVG('trophy', done, FINAL.badge.name) + '<div><h2>' + esc(FINAL.badge.name) + '</h2><p>' + (done ? esc(FINAL.badge.desc) : 'أكمل الخطوات الست لتحصل على الوسام.') + '</p>' +
      (done ? '<p><strong>مستواك النهائي: ' + esc(LEVELS[li].name) + '</strong> — ' + fmt(xp) + ' من ' + fmt(MAX_XP) + ' نقطة.</p>' : '') + '</div></section>';
    if (done) {
      h += '<section class="section card"><h2>ماذا بعد؟ ثلاث خطوات لتطبيق ما تعلمته غدًا</h2><ol>' +
        '<li>أنشئ مشروعًا لدورة المنح الحالية، وارفع فيه دليل المعايير وتعليمات الأسلوب (المرحلة 3).</li>' +
        '<li>جرّب أمر الموجز الصباحي يدويًا أسبوعًا، ثم حوّله إلى مهمة مجدولة (المرحلة 4).</li>' +
        '<li>اتفق مع فريقك على تصنيف البيانات قبل الرفع، واجعل دليل الخصوصية مرجعًا مشتركًا.</li></ol>' +
        '<p class="muted">يمكنك إعادة أي مرحلة لمراجعة الأوامر الجاهزة، أو الضغط على «إعادة البدء» أسفل الصفحة لبدء موسم جديد.</p></section>';
    }
    return h;
  }

  /* ---------- الأحداث ---------- */
  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act; const key = b.dataset.key;
    if (b.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    switch (act) {
      case 'pick': pick(key, Number(b.dataset.i)); refresh(); break;
      case 'up': moveOrder(key, Number(b.dataset.pos), -1); refresh(); break;
      case 'down': moveOrder(key, Number(b.dataset.pos), 1); refresh(); break;
      case 'order-check': checkOrder(key); refresh(); break;
      case 'match-check': checkMatch(key); refresh(); break;
      case 'lab-done': labDone(key); refresh(); break;
      case 'copy': { const el = document.getElementById(b.dataset.src); if (el) copyText(el.textContent); break; }
      case 'theme': state.theme = THEMES[(THEMES.indexOf(state.theme) + 1) % THEMES.length]; applyTheme(); save(); renderHeader(); toast('المظهر: ' + THEME_LABEL[state.theme]); break;
      case 'open-facil': { const d = $('#facil'); renderFacil(); if (d.showModal) d.showModal(); else d.setAttribute('open', ''); break; }
      case 'close-facil': $('#facil').close(); break;
      case 'open-proj': projReturn = $('#facilBtn'); openProjector(); break;
      case 'close-proj': closeProjector(); break;
      case 'score': { const t = state.teams[Number(b.dataset.i)]; if (t) { t.score = Math.max(0, t.score + Number(b.dataset.d)); save(); updateTeams(); } break; }
      case 'scores-reset': state.teams.forEach(t => { t.score = 0; }); save(); updateTeams(); break;
      case 't-set': tSet(Number(b.dataset.sec)); break;
      case 't-toggle': tToggle(); break;
      case 't-reset': tSet(timer.dur); break;
      case 'restart':
        if (window.confirm('سيُحذف تقدمك ونقاطك وشاراتك في هذا المتصفح. هل تريد إعادة البدء؟')) {
          const keep = { theme: state.theme, big: state.big, teams: state.teams };
          state = Object.assign(freshProgress(), keep);
          Object.keys(MARKS).forEach(k => delete MARKS[k]); Object.keys(FEED).forEach(k => delete FEED[k]);
          save(); toast('بدأت موسمًا جديدًا');
          if (location.hash !== '#home') location.hash = '#home'; else { renderHeader(); renderView(true); }
        }
        break;
    }
  });
  document.addEventListener('change', function (e) {
    const el = e.target.closest('[data-change]'); if (!el) return;
    const kind = el.dataset.change; const key = el.dataset.key;
    if (kind === 'match') {
      const arr = state.matches[key] || (state.matches[key] = []);
      arr[Number(el.dataset.i)] = el.value === '' ? null : Number(el.value);
      if (MARKS[key]) { MARKS[key][Number(el.dataset.i)] = undefined; }
      const row = el.closest('.match-row');
      if (row) { row.classList.remove('ok', 'bad'); row.querySelectorAll(':scope > .icon, :scope > .sr-only').forEach(n => n.remove()); }
      el.removeAttribute('aria-invalid');
      delete FEED[key]; save();
    } else if (kind === 'labcheck') {
      const arr = state.checks[key] || (state.checks[key] = []);
      arr[Number(el.dataset.i)] = el.checked; save();
    } else if (kind === 'unlockall') {
      state.unlockAll = el.checked; save(); refresh(); toast(el.checked ? 'فُتحت جميع المراحل' : 'عاد فتح المراحل بالتسلسل');
    } else if (kind === 'big') {
      state.big = el.checked; applyTheme(); save();
    } else if (kind === 'teamcount') {
      const n = Number(el.value);
      while (state.teams.length < n) state.teams.push({ name: 'الفريق ' + (state.teams.length + 1), score: 0 });
      state.teams.length = n; save(); updateTeams();
    }
  });
  let saveTimer = null;
  document.addEventListener('input', function (e) {
    const el = e.target;
    if (el.matches('[data-input="lab"]')) {
      const key = el.dataset.key; state.labs[key] = el.value;
      const c = document.getElementById('cnt-' + key); if (c) c.textContent = 'عدد الأحرف: ' + el.value.length + ' (الحد الأدنى ' + MIN_LAB + ')';
      clearTimeout(saveTimer); saveTimer = setTimeout(save, 400);
    } else if (el.matches('[data-input="team"]')) {
      const t = state.teams[Number(el.dataset.i)]; if (t) { t.name = el.value.slice(0, 40) || ('الفريق ' + (Number(el.dataset.i) + 1)); clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#projector').hidden) { e.preventDefault(); closeProjector(); }
  });
  $('#facil').addEventListener('close', function () { const b = $('#facilBtn'); if (b && $('#projector').hidden) b.focus(); });
  window.addEventListener('hashchange', function () {
    const h = (location.hash || '').replace('#', '');
    if (ROUTES.indexOf(h) < 0) return;
    renderHeader(); renderView(true);
  });

  /* ---------- البدء ---------- */
  applyTheme();
  renderHeader();
  renderView(false);
  window.AIFD = { MODULES: MODULES, FINAL: FINAL, state: function () { return state; } };
})();
</script>
</body>
</html>
