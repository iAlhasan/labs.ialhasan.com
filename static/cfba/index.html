<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملخصات مستشار المنشآت العائلية المعتمد</title>
<meta name="description" content="ملخصات مقررات برنامج مستشار المنشآت العائلية المعتمد: ملخص مكثف وملخص مع أسئلة مراجعة لكل مقرر.">
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6a6f76;
    --line: #e3e1da;
    --accent: #1f6f5c;
    --accent-soft: #e4f0ec;
    --accent-text: #ffffff;
    --soon: #9a6b12;
    --soon-soft: #f6ecd6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b;
      --card: #1d2125;
      --text: #e7e9eb;
      --muted: #9aa1a8;
      --line: #2e3439;
      --accent: #5cc0a2;
      --accent-soft: #1f3a33;
      --accent-text: #0f1f1a;
      --soon: #e0b25c;
      --soon-soft: #3a3020;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans Arabic", "IBM Plex Arabic", system-ui, "Segoe UI", "SF Arabic", "Geeza Pro", Tahoma, sans-serif;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 56px; }

  header h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 4px; line-height: 1.35; }
  header p { margin: 0; color: var(--muted); }

  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin: 24px 0 8px;
  }
  .counter {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: .95rem; white-space: nowrap;
  }
  .counter strong { color: var(--accent); font-variant-numeric: tabular-nums; }
  .meter { width: 72px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .search { flex: 1 1 220px; position: relative; }
  .search input {
    width: 100%; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px;
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font: inherit; font-size: .9rem; text-decoration: none; cursor: pointer;
    border-radius: 8px; padding: 6px 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; pointer-events: none; }
  .btn svg { width: 16px; height: 16px; flex: none; }

  section.axis { margin-top: 32px; }
  section.axis h2 {
    font-size: 1.05rem; color: var(--muted); font-weight: 600;
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 12px;
  }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .num {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 700;
    background: var(--accent-soft); color: var(--accent);
  }
  .card h3 { margin: 0; font-size: 1.1rem; }
  .file { border-top: 1px dashed var(--line); padding-top: 10px; }
  .file-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .file-name { font-weight: 600; font-size: .95rem; }
  .file-meta { color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 6px; }
  .soon {
    font-size: .75rem; font-weight: 600; color: var(--soon); background: var(--soon-soft);
    padding: 1px 8px; border-radius: 999px; margin-inline-start: 6px;
  }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: inherit; }

  /* العارض */
  .viewer {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    background: var(--bg);
  }
  .viewer.open { display: flex; }
  .viewer-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--line);
  }
  .viewer-title { flex: 1 1 200px; min-width: 0; }
  .viewer-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer-title span { color: var(--muted); font-size: .85rem; }
  .viewer iframe { flex: 1; width: 100%; border: 0; background: #525659; }
  body.locked { overflow: hidden; }

  @media (max-width: 480px) {
    .wrap { padding-top: 24px; }
    .grid { grid-template-columns: 1fr; }
    .viewer-bar .btn .label { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ملخصات مستشار المنشآت العائلية المعتمد</h1>
    <p>لكل مقرر ملفان: ملخص مكثف للمراجعة السريعة، وملخص كامل مع أسئلة المراجعة.</p>
  </header>

  <div class="toolbar">
    <div class="counter" id="counter"></div>
    <label class="search">
      <input type="search" id="q" placeholder="ابحث باسم المقرر…" aria-label="ابحث باسم المقرر" autocomplete="off">
    </label>
    <a class="btn primary" id="zip"></a>
  </div>

  <main id="list"></main>
  <p class="empty" id="empty" hidden>لا يوجد مقرر يطابق البحث.</p>

  <footer>
    <a href="../">معامل الحسن</a>
  </footer>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="v-course">
  <div class="viewer-bar">
    <button class="btn" id="v-back" type="button" title="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      <span class="label">رجوع</span>
    </button>
    <div class="viewer-title">
      <strong id="v-course"></strong>
      <span id="v-type"></span>
    </div>
    <a class="btn" id="v-open" target="_blank" rel="noopener" title="فتح في نافذة جديدة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      <span class="label">فتح في نافذة جديدة</span>
    </a>
    <a class="btn primary" id="v-download" title="تنزيل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
      <span class="label">تنزيل</span>
    </a>
  </div>
  <iframe id="v-frame" title="عارض الملف"></iframe>
</div>

<script src="files.js"></script>
<script>
(function () {
  var data = window.CFBA;
  var list = document.getElementById('list');
  var empty = document.getElementById('empty');
  var viewer = document.getElementById('viewer');
  var frame = document.getElementById('v-frame');
  var ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';
  var ICON_VIEW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

  if (!data) {
    list.innerHTML = '<p class="empty">لم يُعثر على files.js. شغّل build.py أولاً.</p>';
    return;
  }

  // متصفحات الجوال لا تعرض PDF داخل الصفحة بشكل موثوق، فنفتح الملف في تبويب جديد
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
    navigator.pdfViewerEnabled === false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function url(file) { return 'pdfs/' + encodeURIComponent(file); }
  function size(bytes) {
    var mb = bytes / 1048576;
    return mb >= 1 ? mb.toFixed(1) + ' م.ب' : Math.round(bytes / 1024) + ' ك.ب';
  }
  function pages(n) {
    if (!n) return '';
    if (n === 1) return 'صفحة واحدة';
    if (n === 2) return 'صفحتان';
    if (n <= 10) return n + ' صفحات';
    return n + ' صفحة';
  }
  // توحيد الكتابة العربية للبحث: الهمزات والتاء المربوطة والألف المقصورة والتشكيل
  function norm(s) {
    return s.normalize('NFC')
      .replace(/[ً-ْـ]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/^ال|\sال/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // العداد وزر التنزيل الشامل
  var pct = Math.round(data.available / data.total * 100);
  document.getElementById('counter').innerHTML =
    'المتوفر <strong>' + data.available + '</strong> من ' + data.total + ' ملفاً' +
    '<span class="meter" aria-hidden="true"><span style="width:' + pct + '%"></span></span>';
  var zip = document.getElementById('zip');
  zip.innerHTML = ICON_DL + '<span>تنزيل كل الملفات</span>';
  if (data.available) {
    zip.href = data.zip.file;
    zip.setAttribute('download', data.zip.name);
    zip.title = 'ملف ZIP — ' + size(data.zip.size);
  } else {
    zip.setAttribute('aria-disabled', 'true');
  }

  // البطاقات
  var html = '';
  data.axes.forEach(function (axisName, axisIndex) {
    var cards = data.courses.filter(function (c) { return c.axis === axisIndex; });
    html += '<section class="axis" data-axis="' + axisIndex + '"><h2>' + esc(axisName) + '</h2><div class="grid">';
    cards.forEach(function (c) {
      html += '<article class="card" data-search="' + esc(norm(c.title + ' ' + c.num)) + '">' +
        '<div class="card-head"><span class="num">' + c.num + '</span><h3>' + esc(c.title) + '</h3></div>';
      Object.keys(data.types).forEach(function (type) {
        var f = c.files[type];
        html += '<div class="file"><div class="file-row"><div>' +
          '<div class="file-name">' + esc(data.types[type]) + (f ? '' : '<span class="soon">قريباً</span>') + '</div>' +
          '<div class="file-meta">' + (f ? pages(f.pages) + ' · ' + size(f.size) : 'غير متوفر بعد') + '</div>' +
          '</div><div class="actions">';
        if (f) {
          html += '<a class="btn" href="' + url(f.file) + '" data-view="' + c.num + '/' + type + '" target="_blank" rel="noopener">' + ICON_VIEW + 'استعراض</a>' +
            '<a class="btn primary" href="' + url(f.file) + '" download="' + esc(f.file) + '">' + ICON_DL + 'تنزيل</a>';
        } else {
          html += '<span class="btn" aria-disabled="true">' + ICON_VIEW + 'استعراض</span>' +
            '<span class="btn" aria-disabled="true">' + ICON_DL + 'تنزيل</span>';
        }
        html += '</div></div></div>';
      });
      html += '</article>';
    });
    html += '</div></section>';
  });
  list.innerHTML = html;

  // البحث
  var q = document.getElementById('q');
  q.addEventListener('input', function () {
    var term = norm(q.value);
    var shown = 0;
    list.querySelectorAll('section.axis').forEach(function (sec) {
      var visible = 0;
      sec.querySelectorAll('.card').forEach(function (card) {
        var ok = !term || card.getAttribute('data-search').indexOf(term) !== -1;
        card.hidden = !ok;
        if (ok) visible++;
      });
      sec.hidden = visible === 0;
      shown += visible;
    });
    empty.hidden = shown !== 0;
  });

  // العارض: يرتبط بعنوان الصفحة (#view/رقم/نوع) ليعمل زر الرجوع في المتصفح أيضاً
  function find(key) {
    var parts = key.split('/');
    var c = data.courses.filter(function (x) { return String(x.num) === parts[0]; })[0];
    var f = c && c.files[parts[1]];
    return f ? { course: c, type: parts[1], file: f } : null;
  }
  function openViewer(item) {
    var href = url(item.file.file);
    document.getElementById('v-course').textContent = item.course.num + '. ' + item.course.title;
    document.getElementById('v-type').textContent = data.types[item.type] + ' · ' + pages(item.file.pages) + ' · ' + size(item.file.size);
    document.getElementById('v-open').href = href;
    var dl = document.getElementById('v-download');
    dl.href = href;
    dl.setAttribute('download', item.file.file);
    frame.src = href;
    viewer.classList.add('open');
    document.body.classList.add('locked');
    document.title = item.course.title + ' — ' + data.types[item.type];
    document.getElementById('v-back').focus();
  }
  function closeViewer() {
    openedHere = false;
    viewer.classList.remove('open');
    document.body.classList.remove('locked');
    frame.removeAttribute('src');
    document.title = 'ملخصات مستشار المنشآت العائلية المعتمد';
  }
  function route() {
    var m = location.hash.match(/^#view\/(.+)$/);
    var item = m && find(decodeURIComponent(m[1]));
    if (item && !isMobile) openViewer(item); else closeViewer();
  }
  var openedHere = false;
  list.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-view]');
    if (!a || isMobile || e.ctrlKey || e.metaKey || e.shiftKey) return; // يُترك للرابط فتحه في تبويب جديد
    e.preventDefault();
    openedHere = true;
    location.hash = 'view/' + a.getAttribute('data-view');
  });
  function back() {
    if (openedHere) { openedHere = false; history.back(); }
    else { history.replaceState(null, '', location.pathname + location.search); route(); }
  }
  document.getElementById('v-back').addEventListener('click', back);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && viewer.classList.contains('open')) back();
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
